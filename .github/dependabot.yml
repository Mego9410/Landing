version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
    ignore:
      # Expo pins these to the SDK. Upgrade them together with `npx expo install --fix` when moving SDK.
      - dependency-name: "expo*"
      - dependency-name: "react-native*"
      - dependency-name: "@expo/*"
      - dependency-name: "@react-native/*"
      # React is shared by the web and Expo apps and must match the version the Expo SDK pins.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
