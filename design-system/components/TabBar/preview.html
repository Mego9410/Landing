<!doctype html>
<html>
<head><meta charset="utf-8"><title>TabBar — preview</title></head>
<body>
<div id="root" class="ld-stage"></div>
<script>
  var L = window.Landing, h = React.createElement;
  function Demo() {
    var s = React.useState('today');
    return h(L.TabBar, { active: s[0], onChange: s[1] });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
