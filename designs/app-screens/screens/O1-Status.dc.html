<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>O1 Where you are now</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../../../design-system/components/bundle.css">
<script src="../../../design-system/components/bundle.js"></script>
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&amp;family=Nunito:wght@400..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr plain" style="width: 390px; height: 844px">
  <div class="topbar">
    <a class="iconbtn flat" href="A2-Welcome.dc.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="steps"><span style="width: 11%"></span></div>
    <span class="caption muted">1 of 9</span>
  </div>
  <div class="stack">
    <h1 class="t-title">Where are you with your jab?</h1>
    <p class="body muted">This sets where your plan starts. There's no wrong answer.</p>
  </div>
  <div class="stack">
    <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
      <button type="button" class="{{o.cls}}" onClick="{{o.pick}}">
        <span class="radio"></span>
        <span class="stack grow" style="gap: 2px"><span style="font-weight: 800">{{o.title}}</span><span class="caption" style="opacity: .8">{{o.detail}}</span></span>
      </button>
    </sc-for>
  </div>
  <p class="caption muted">Landing never gives advice about doses or stopping. That's for your prescriber.</p>
  <div class="foot">
    <a class="ld-btn ld-btn--primary ld-btn--md ld-btn--block" href="O2-StopDate.dc.html">Continue</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { picked: 'stopped' }; }
  renderVals() {
    const items = [
      { id: 'stopped', title: "I've stopped", detail: 'My last injection has been and gone' },
      { id: 'soon', title: "I'm stopping soon", detail: 'I want a plan ready before I do' },
      { id: 'on', title: "I'm still on it", detail: "I'm planning ahead, no date yet" }
    ];
    return { options: items.map((o) => ({ ...o, cls: 'option' + (this.state.picked === o.id ? ' sel' : ''), pick: () => this.setState({ picked: o.id }) })) };
  }
}
</script>
</body>
</html>
