<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>O10 Reminders</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../../../packages/design-system/components/bundle.css">
<script src="../../../packages/design-system/components/bundle.js"></script>
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&amp;family=Nunito:wght@400..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr plain" style="width: 390px; height: 844px">
  <div class="topbar">
    <a class="iconbtn flat" href="O9-AppleHealth.dc.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="steps"><span style="width: 100%"></span></div>
    <span class="caption muted">9 of 9</span>
  </div>
  <div class="stack">
    <h1 class="t-title">A gentle nudge, once a day</h1>
    <p class="body muted">Short, kind reminders for your habits. Never about your weight.</p>
  </div>
  <div class="card" style="flex-direction: row; gap: 12px; align-items: flex-start; box-shadow: var(--shadow-lg)">
    <img src="../../../packages/design-system/assets/Logos/steadie-mark-apricot.svg" alt="" style="width: 24px; height: 32px; flex: none; margin-top: 2px">
    <div class="grow">
      <div class="between"><span class="label">STEADIE</span><span class="caption muted">now</span></div>
      <p class="body">Afternoon dip? A protein snack now takes the edge off later.</p>
    </div>
  </div>
  <div class="stack">
    <p class="label">WHEN SHOULD WE REMIND YOU?</p>
    <div class="wrap">
      <sc-for list="{{times}}" as="o" hint-placeholder-count="3"><button type="button" class="{{o.cls}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for>
    </div>
  </div>
  <div class="foot">
    <a class="ld-btn ld-btn--primary ld-btn--md ld-btn--block" href="O11-Building.dc.html">Turn on reminders</a>
    <a class="ld-btn ld-btn--quiet ld-btn--sm" href="O11-Building.dc.html" style="align-self: center">Not now</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { t: 'Afternoon · 15:30' }; }
  renderVals() {
    return { times: ['Morning · 8:00', 'Lunch · 12:30', 'Afternoon · 15:30', 'Evening · 19:00'].map((label) => ({ label, cls: 'choice' + (this.state.t === label ? ' on' : ''), pick: () => this.setState({ t: label }) })) };
  }
}
</script>
</body>
</html>
