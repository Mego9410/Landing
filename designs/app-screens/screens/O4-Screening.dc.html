<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>O4 A few quick questions</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../../../design-system/components/bundle.css">
<script src="../../../design-system/components/bundle.js"></script>
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&amp;family=Nunito:wght@400..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr plain" style="width: 390px; height: 844px">
  <div class="topbar">
    <a class="iconbtn flat" href="O3-StartingPoint.dc.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="steps"><span style="width: 44%"></span></div>
    <span class="caption muted">4 of 9</span>
  </div>
  <div class="stack">
    <p class="eyebrow">A FEW QUICK QUESTIONS</p>
    <h1 class="t-title">So we can look after you properly</h1>
    <p class="body muted">Your answers stay private and only change how the app talks about weight.</p>
  </div>
  <div class="card hero tint-sky" style="gap: 16px; margin-top: 8px">
    <span class="caption">Question 2 of 5</span>
    <p class="t-heading" style="font-size: 22px; line-height: 30px">Does food or eating often feel like it controls your day?</p>
    <div class="row">
      <button type="button" class="{{noCls}}" onClick="{{pickNo}}" style="flex: 1">No</button>
      <button type="button" class="{{yesCls}}" onClick="{{pickYes}}" style="flex: 1">Yes</button>
    </div>
  </div>
  <div class="row" style="justify-content: center; gap: 6px" aria-hidden="true">
    <span class="dot" style="background: var(--sky-ink)"></span><span class="dot" style="background: var(--sky-ink); width: 20px"></span><span class="dot" style="background: var(--line)"></span><span class="dot" style="background: var(--line)"></span><span class="dot" style="background: var(--line)"></span>
  </div>
  <p class="caption muted" style="text-align: center">[Final question wording to be set with a clinician]</p>
  <div class="foot">
    <a class="ld-btn ld-btn--primary ld-btn--md ld-btn--block" href="{{next}}">Next question</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { a: 'no' }; }
  renderVals() {
    const a = this.state.a;
    return {
      noCls: 'choice' + (a === 'no' ? ' on' : ''), yesCls: 'choice' + (a === 'yes' ? ' on' : ''),
      pickNo: () => this.setState({ a: 'no' }), pickYes: () => this.setState({ a: 'yes' }),
      next: a === 'yes' ? 'O5-Support.dc.html' : 'O6-Training.dc.html'
    };
  }
}
</script>
</body>
</html>
