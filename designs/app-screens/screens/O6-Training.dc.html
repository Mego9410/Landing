<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>O6 Your training</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../../../design-system/components/bundle.css">
<script src="../../../design-system/components/bundle.js"></script>
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&amp;family=Nunito:wght@400..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr plain" style="width: 390px; height: 844px">
  <div class="topbar">
    <a class="iconbtn flat" href="O4-Screening.dc.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="steps"><span style="width: 56%"></span></div>
    <span class="caption muted">5 of 9</span>
  </div>
  <div class="stack">
    <h1 class="t-title">Strength keeps what you've worked for</h1>
    <p class="body muted">Muscle helps your body hold steady after the jab. We'll start gently.</p>
  </div>
  <div class="stack">
    <p class="label">HOW MUCH STRENGTH TRAINING HAVE YOU DONE?</p>
    <div class="wrap">
      <sc-for list="{{levels}}" as="o" hint-placeholder-count="3"><button type="button" class="{{o.cls}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for>
    </div>
  </div>
  <div class="stack">
    <p class="label">DAYS A WEEK YOU COULD TRAIN</p>
    <div class="wrap">
      <sc-for list="{{days}}" as="o" hint-placeholder-count="4"><button type="button" class="{{o.cls}}" onClick="{{o.pick}}" style="min-width: 64px; justify-content: center">{{o.label}}</button></sc-for>
    </div>
  </div>
  <div class="stack">
    <p class="label">WHERE</p>
    <div class="wrap">
      <sc-for list="{{places}}" as="o" hint-placeholder-count="3"><button type="button" class="{{o.cls}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for>
    </div>
  </div>
  <div class="foot">
    <a class="ld-btn ld-btn--primary ld-btn--md ld-btn--block" href="O7-FoodHunger.dc.html">Continue</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { level: 'Some', days: '2', place: 'At home' }; }
  renderVals() {
    const mk = (key, list) => list.map((label) => ({ label, cls: 'choice' + (this.state[key] === label ? ' on' : ''), pick: () => this.setState({ [key]: label }) }));
    return {
      levels: mk('level', ['None yet', 'Some', 'I train regularly']),
      days: mk('days', ['2', '3', '4', '5+']),
      places: mk('place', ['At home', 'At a gym', 'Both'])
    };
  }
}
</script>
</body>
</html>
