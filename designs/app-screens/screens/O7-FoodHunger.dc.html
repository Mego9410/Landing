<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>O7 Food and hunger</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../../../design-system/components/bundle.css">
<script src="../../../design-system/components/bundle.js"></script>
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&amp;family=Nunito:wght@400..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr plain" style="width: 390px; height: 844px">
  <div class="topbar">
    <a class="iconbtn flat" href="O6-Training.dc.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="steps"><span style="width: 67%"></span></div>
    <span class="caption muted">6 of 9</span>
  </div>
  <div class="stack">
    <h1 class="t-title">Food and hunger</h1>
    <p class="body muted">Appetite often comes back after the jab. Knowing your hungry times helps us plan around them.</p>
  </div>
  <div class="stack">
    <p class="label">HOW OFTEN DO YOUR MEALS INCLUDE PROTEIN?</p>
    <div class="stack" style="gap: 8px">
      <sc-for list="{{protein}}" as="o" hint-placeholder-count="3">
        <button type="button" class="{{o.cls}}" onClick="{{o.pick}}" style="padding: 14px 16px"><span class="radio"></span><span style="font-weight: 700">{{o.label}}</span></button>
      </sc-for>
    </div>
  </div>
  <div class="stack">
    <p class="label">WHEN DO YOU USUALLY FEEL HUNGRIEST? PICK ANY</p>
    <div class="wrap">
      <sc-for list="{{times}}" as="o" hint-placeholder-count="5"><button type="button" class="{{o.cls}}" onClick="{{o.pick}}" aria-pressed="{{o.on}}">{{o.label}}</button></sc-for>
    </div>
  </div>
  <div class="foot">
    <a class="ld-btn ld-btn--primary ld-btn--md ld-btn--block" href="O8-Consent.dc.html">Continue</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { protein: 'Some meals', times: ['Afternoon', 'Evening'] }; }
  renderVals() {
    const t = this.state.times;
    return {
      protein: ['Rarely', 'Some meals', 'Most meals'].map((label) => ({ label, cls: 'option' + (this.state.protein === label ? ' sel' : ''), pick: () => this.setState({ protein: label }) })),
      times: ['Morning', 'Lunchtime', 'Afternoon', 'Evening', 'Late night'].map((label) => {
        const on = t.indexOf(label) >= 0;
        return { label, on, cls: 'choice' + (on ? ' on' : ''), pick: () => this.setState({ times: on ? t.filter((x) => x !== label) : t.concat(label) }) };
      })
    };
  }
}
</script>
</body>
</html>
