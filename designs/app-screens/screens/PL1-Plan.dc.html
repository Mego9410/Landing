<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PL1 Your plan</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../../../packages/design-system/components/bundle.css">
<script src="../../../packages/design-system/components/bundle.js"></script>
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&amp;family=Nunito:wght@400..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr" style="width: 390px; height: 1000px">
  <div class="topbar">
    <div class="stack" style="gap: 2px"><p class="caption muted">Week 6 of 52</p><h1 class="t-title">Your plan</h1></div>
    <a class="avatar" href="S1-Settings.dc.html" aria-label="Settings">H</a>
  </div>
  <a class="card hero tint-apricot" href="PL2-Week.dc.html" style="text-decoration: none; gap: 6px">
    <span class="label">THIS WEEK</span>
    <span class="t-heading" style="font-size: 22px">Protein first</span>
    <span class="body">Lesson, three habits and two sessions</span>
  </a>
  <sc-for list="{{phases}}" as="p" hint-placeholder-count="3">
    <div class="card" style="gap: 12px">
      <div class="between">
        <div class="row" style="gap: 10px"><span class="dot" style="{{p.dotStyle}}"></span><span class="t-heading">{{p.name}}</span></div>
        <span class="caption muted">{{p.range}}</span>
      </div>
      <p class="body muted">{{p.focus}}</p>
      <div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{p.weeks}}" as="w" hint-placeholder-count="8">
          <span title="{{w.title}}" style="{{w.style}}"></span>
        </sc-for>
      </div>
    </div>
  </sc-for>
  <div class="row caption muted" style="gap: 14px">
    <span class="row" style="gap: 6px"><span class="dot" style="background: var(--sage-ink)"></span>Done</span>
    <span class="row" style="gap: 6px"><span class="dot" style="background: var(--apricot); box-shadow: 0 0 0 2px var(--apricot-ink)"></span>This week</span>
    <span class="row" style="gap: 6px"><span class="dot" style="background: var(--surface-sunk); box-shadow: inset 0 0 0 1.5px var(--line)"></span>Coming up</span>
  </div>
  <div class="tabslot"><dc-import name="TabBar" active="plan" hint-size="350px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const current = 6;
    const base = 'display: block; aspect-ratio: 1; border-radius: 9999px; ';
    const weeks = (from, to) => {
      const out = [];
      for (let w = from; w <= to; w++) {
        const st = w < current ? 'background: var(--sage-ink)' : w === current ? 'background: var(--apricot); box-shadow: 0 0 0 2px var(--apricot-ink)' : 'background: var(--surface-sunk); box-shadow: inset 0 0 0 1.5px var(--line)';
        out.push({ title: 'Week ' + w, style: base + st });
      }
      return out;
    };
    return { phases: [
      { name: 'Land', range: 'Weeks 1–8', focus: 'Appetite returning, protein at every meal, two strength sessions.', dotStyle: 'background: var(--sky-ink)', weeks: weeks(1, 8) },
      { name: 'Settle', range: 'Weeks 9–26', focus: 'Meal structure, eating out, handling cravings, a third session.', dotStyle: 'background: var(--sage-ink)', weeks: weeks(9, 26) },
      { name: 'Steady', range: 'Weeks 27–52', focus: 'Your own routines, fewer prompts, monthly check-ins.', dotStyle: 'background: var(--lilac-ink)', weeks: weeks(27, 52) }
    ] };
  }
}
</script>
</body>
</html>
