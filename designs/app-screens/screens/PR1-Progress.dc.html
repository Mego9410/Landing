<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PR1 Progress</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../../../packages/design-system/components/bundle.css">
<script src="../../../packages/design-system/components/bundle.js"></script>
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&amp;family=Nunito:wght@400..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr" style="width: 390px; height: 1150px">
  <div class="topbar">
    <h1 class="t-title">Progress</h1>
    <a class="avatar" href="S1-Settings.dc.html" aria-label="Settings">H</a>
  </div>

  <a class="card hero" href="PR2-Score.dc.html" style="flex-direction: row; align-items: center; gap: 16px; text-decoration: none; color: var(--ink)">
    <x-import component-from-global-scope="Landing.ScoreRing" score="{{score}}" size="{{ring}}" label="This week"></x-import>
    <span class="grow stack" style="gap: 4px">
      <span class="label muted">LANDING SCORE</span>
      <span class="body" style="font-weight: 700">Habits carried you this week.</span>
      <span class="caption" style="color: var(--sage-ink)">Up 6 on last week</span>
      <span class="caption muted">How it's worked out ›</span>
    </span>
  </a>

  <div class="card hero" style="gap: 14px">
    <div class="between">
      <h2 class="t-heading">Weight trend</h2>
      <span class="caption muted">7-day average</span>
    </div>
    <div class="seg" role="group" aria-label="Time range">
      <sc-for list="{{ranges}}" as="r" hint-placeholder-count="3"><button type="button" class="{{r.cls}}" onClick="{{r.pick}}">{{r.label}}</button></sc-for>
    </div>
    <svg viewBox="0 0 310 170" width="310" height="170" role="img" aria-label="{{chartLabel}}" style="display: block; max-width: 100%">
      <rect x="0" y="{{bandY}}" width="310" height="{{bandH}}" rx="10" style="fill: var(--sage)"></rect>
      <text x="8" y="{{bandLabelY}}" style="fill: var(--sage-ink); font: 700 11px var(--font-body)">Your steady zone</text>
      <line x1="0" x2="310" y1="150" y2="150" style="stroke: var(--line)"></line>
      <path d="{{line}}" style="fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round"></path>
      <circle cx="{{lastX}}" cy="{{lastY}}" r="6" style="fill: var(--apricot); stroke: var(--ink); stroke-width: 2"></circle>
      <text x="0" y="166" style="fill: var(--ink-muted); font: 600 11px var(--font-body)">{{startLabel}}</text>
      <text x="310" y="166" text-anchor="end" style="fill: var(--ink-muted); font: 600 11px var(--font-body)">Today</text>
    </svg>
    <div class="between">
      <span class="t-num-md">78.5 <span class="body muted">kg</span></span>
      <span class="pill-tag tint-sage">Inside your steady zone</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <div class="card" style="gap: 8px"><span class="label muted">HABITS</span><span class="t-num-md">13/15</span><div class="meter"><span style="width: 87%"></span></div></div>
    <div class="card" style="gap: 8px"><span class="label muted">WORKOUTS</span><span class="t-num-md">2/2</span><div class="meter"><span style="width: 100%"></span></div></div>
  </div>

  <div class="list">
    <a class="li" href="PR5-History.dc.html"><span class="ico tint-sky"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5h16"></path><path d="M5 15l4.5-4.5 3.5 3 6-6"></path></svg></span><span class="grow" style="font-weight: 800">Weigh-in history</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></a>
    <a class="li" href="PR6-PrescriberPack.dc.html"><span class="ico tint-sky"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h7l4 4v13H7z"></path><path d="M14 3.5v4h4M9.5 13h6M9.5 16.5h6"></path></svg></span><span class="grow" style="font-weight: 800">Prescriber pack</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></a>
  </div>

  <div class="tabslot"><dc-import name="TabBar" active="progress" hint-size="350px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1150}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { range: 30 }; }
  renderVals() {
    const span = this.state.range;
    const days = 36;
    const series = [];
    for (let i = 0; i < days; i++) {
      const v = 79.3 - 0.026 * i + 0.22 * Math.sin(i * 1.1) + 0.12 * Math.sin(i * 0.37);
      series.push(Math.round(v * 10) / 10);
    }
    const shown = series.slice(Math.max(0, days - span));
    const lo = 77.0, hi = 80.6;
    const Y = (v) => 150 - (v - lo) / (hi - lo) * 140;
    const startIdx = span - shown.length;
    const X = (i) => ((startIdx + i) / (span - 1)) * 300 + 5;
    const line = shown.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
    const bandTop = Y(78.0 * 1.02), bandBot = Y(78.0);
    return {
      score: 78, ring: 112, line,
      lastX: X(shown.length - 1).toFixed(1), lastY: Y(shown[shown.length - 1]).toFixed(1),
      bandY: bandTop.toFixed(1), bandH: (bandBot - bandTop).toFixed(1), bandLabelY: (bandTop + 15).toFixed(1),
      startLabel: span === 30 ? '30 days ago' : span === 90 ? '90 days ago' : 'Last injection',
      chartLabel: 'Weight 7-day average, last ' + span + ' days, staying inside the steady zone',
      ranges: [[30, '30 days'], [90, '90 days'], [36, 'Since stopping']].map(([n, label]) => ({ label, cls: this.state.range === n ? 'on' : '', pick: () => this.setState({ range: n }) }))
    };
  }
}
</script>
</body>
</html>
