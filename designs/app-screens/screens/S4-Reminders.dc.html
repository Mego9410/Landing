<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S4 Reminders</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../../../design-system/components/bundle.css">
<script src="../../../design-system/components/bundle.js"></script>
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&amp;family=Nunito:wght@400..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr plain" style="width: 390px; height: 844px">
  <div class="topbar">
    <a class="iconbtn flat" href="S1-Settings.dc.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
  </div>
  <div class="stack">
    <h1 class="t-title">Reminders</h1>
    <p class="body muted">Kind, short and never about a number on the scales.</p>
  </div>
  <div class="list">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div class="li" style="align-items: flex-start">
        <span class="grow stack" style="gap: 2px"><span style="font-weight: 800">{{r.name}}</span><span class="caption muted">{{r.note}}</span></span>
        <button type="button" class="{{r.cls}}" onClick="{{r.toggle}}" aria-label="{{r.name}}" aria-pressed="{{r.on}}"></button>
      </div>
    </sc-for>
  </div>
  <p class="caption muted">Weigh-in reminders are off unless you turn them on, and they never show a weight on your lock screen.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { habit: true, score: true, weigh: false, trial: true }; }
  renderVals() {
    const defs = [
      ['habit', 'Daily habit nudge', 'Every day at 15:30'],
      ['score', 'Your week is ready', 'Sundays at 18:00'],
      ['weigh', 'Weigh-in reminder', 'Off'],
      ['trial', 'Trial ending', 'Two days before you are charged']
    ];
    return { rows: defs.map(([k, name, note]) => ({ name, note, on: this.state[k], cls: 'toggle' + (this.state[k] ? ' on' : ''), toggle: () => this.setState({ [k]: !this.state[k] }) })) };
  }
}
</script>
</body>
</html>
