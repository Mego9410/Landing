<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../../../packages/design-system/components/bundle.css">
<script src="../../../packages/design-system/components/bundle.js"></script>
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&amp;family=Nunito:wght@400..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav class="ld-tabbar" aria-label="Main" style="width: 350px; height: 84px; box-sizing: border-box; font-family: var(--font-body); color: var(--ink)">
  <a class="{{todayCls}}" href="T1-Today.dc.html" style="text-decoration: none">
    <span class="ld-tab__pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v1.5M12 19.5V21M3 12h1.5M19.5 12H21M5.6 5.6l1.1 1.1M17.3 17.3l1.1 1.1M5.6 18.4l1.1-1.1M17.3 6.7l1.1-1.1"></path></svg></span>
    <span class="ld-tab__label">Today</span>
  </a>
  <a class="{{planCls}}" href="PL1-Plan.dc.html" style="text-decoration: none">
    <span class="ld-tab__pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18.5c0-4 3-5 6-6.5s6-2.5 6-6.5"></path><circle cx="6" cy="19" r="1.6"></circle><circle cx="18" cy="5" r="1.6"></circle></svg></span>
    <span class="ld-tab__label">Plan</span>
  </a>
  <a class="{{progressCls}}" href="PR1-Progress.dc.html" style="text-decoration: none">
    <span class="ld-tab__pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5h16"></path><path d="M5 15l4.5-4.5 3.5 3 6-6"></path></svg></span>
    <span class="ld-tab__label">Progress</span>
  </a>
  <a class="{{coachCls}}" href="C2-CoachChat.dc.html" style="text-decoration: none">
    <span class="ld-tab__pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5h10a3 3 0 0 1 3 3v5.5a3 3 0 0 1-3 3h-5.5L7.5 19.5V16H7a3 3 0 0 1-3-3V7.5a3 3 0 0 1 3-3z"></path></svg></span>
    <span class="ld-tab__label">Coach</span>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","plan","progress","coach"],"default":"today"},"$preview":{"width":350,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'today';
    const cls = (k) => 'ld-tab ld-tab--' + k + (a === k ? ' is-active' : '');
    return { todayCls: cls('today'), planCls: cls('plan'), progressCls: cls('progress'), coachCls: cls('coach') };
  }
}
</script>
</body>
</html>
