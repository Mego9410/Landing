<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>W1 This week's sessions</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../../../packages/design-system/components/bundle.css">
<script src="../../../packages/design-system/components/bundle.js"></script>
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&amp;family=Nunito:wght@400..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr" style="width: 390px; height: 844px">
  <div class="topbar">
    <a class="iconbtn flat" href="T1-Today.dc.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span class="caption muted">Week 6</span>
    <span style="width: 44px"></span>
  </div>
  <div class="stack">
    <h1 class="t-title">This week's sessions</h1>
    <p class="body muted">Two short strength sessions. Muscle helps you hold steady.</p>
  </div>
  <div class="seg" role="group" aria-label="Where you train">
    <button type="button" class="{{homeCls}}" onClick="{{pickHome}}">At home</button>
    <button type="button" class="{{gymCls}}" onClick="{{pickGym}}">At the gym</button>
  </div>
  <div class="card tint-sage" style="flex-direction: row; align-items: center; gap: 14px">
    <span style="width: 44px; height: 44px; border-radius: 9999px; background: var(--on-pastel); color: var(--sage); display: grid; place-items: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
    <span class="grow stack" style="gap: 0"><span style="font-weight: 800; font-size: 16px">Strength A</span><span class="caption">Done Thursday · 24 minutes</span></span>
  </div>
  <a class="card" href="W2-SessionOverview.dc.html" style="flex-direction: row; align-items: center; gap: 14px; text-decoration: none; color: var(--ink); box-shadow: inset 0 0 0 2px var(--apricot), var(--shadow-sm)">
    <span style="width: 44px; height: 44px; border-radius: 9999px; background: var(--apricot); color: var(--on-pastel); display: grid; place-items: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8v8M17 8v8M4 10.5v3M20 10.5v3M7 12h10"></path></svg></span>
    <span class="grow stack" style="gap: 0"><span style="font-weight: 800; font-size: 16px">Strength B</span><span class="caption muted">{{bLine}}</span></span>
    <span class="pill-tag tint-apricot">Today</span>
  </a>
  <div class="card tint-sunk" style="flex-direction: row; align-items: center; gap: 14px">
    <span style="width: 44px; height: 44px; border-radius: 9999px; background: var(--surface-raised); display: grid; place-items: center; flex: none; color: var(--ink-muted)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg></span>
    <span class="grow stack" style="gap: 0"><span style="font-weight: 800">Extra session</span><span class="caption muted">Unlocks in Settle, week 9</span></span>
  </div>
  <div class="tabslot"><dc-import name="TabBar" active="today" hint-size="350px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { where: 'home' }; }
  renderVals() {
    const h = this.state.where === 'home';
    return {
      homeCls: h ? 'on' : '', gymCls: h ? '' : 'on',
      pickHome: () => this.setState({ where: 'home' }), pickGym: () => this.setState({ where: 'gym' }),
      bLine: h ? '25 minutes · dumbbells or water bottles' : '30 minutes · dumbbells and a cable machine'
    };
  }
}
</script>
</body>
</html>
