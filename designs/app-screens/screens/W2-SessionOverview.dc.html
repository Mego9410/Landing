<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>W2 Session overview</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../../../design-system/components/bundle.css">
<script src="../../../design-system/components/bundle.js"></script>
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&amp;family=Nunito:wght@400..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr plain" style="width: 390px; height: 900px; gap: 18px">
  <div class="topbar">
    <a class="iconbtn flat" href="W1-Sessions.dc.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
  </div>
  <div class="stack">
    <p class="eyebrow">WEEK 6 · SESSION 2 OF 2</p>
    <h1 class="t-title">Strength B</h1>
    <div class="wrap">
      <x-import component-from-global-scope="Landing.Chip">25 minutes</x-import>
      <x-import component-from-global-scope="Landing.Chip">At home</x-import>
      <x-import component-from-global-scope="Landing.Chip">Dumbbells or water bottles</x-import>
    </div>
  </div>
  <div class="card tint-sky" style="padding: 12px 16px; flex-direction: row; gap: 10px; align-items: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l2.5 2.5"></path></svg>
    <span class="body">Starts with a 3-minute warm-up</span>
  </div>
  <div class="list">
    <sc-for list="{{moves}}" as="m" hint-placeholder-count="5">
      <div class="li">
        <span style="width: 32px; height: 32px; border-radius: 9999px; background: var(--surface-sunk); display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; flex: none">{{m.n}}</span>
        <span class="grow" style="font-weight: 800">{{m.name}}</span>
        <span class="caption muted">{{m.sets}}</span>
      </div>
    </sc-for>
  </div>
  <p class="caption muted">Go at your own pace. Stop if anything hurts.</p>
  <div class="foot">
    <a class="ld-btn ld-btn--primary ld-btn--md ld-btn--block" href="W3-InSession.dc.html">Start session</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { moves: [
      { n: 1, name: 'Goblet squat', sets: '3 × 10' },
      { n: 2, name: 'Glute bridge', sets: '3 × 12' },
      { n: 3, name: 'Incline press-up', sets: '3 × 8' },
      { n: 4, name: 'Bent-over row', sets: '3 × 10' },
      { n: 5, name: 'Dead bug', sets: '2 × 8 each side' }
    ] };
  }
}
</script>
</body>
</html>
