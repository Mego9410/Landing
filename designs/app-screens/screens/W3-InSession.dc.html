<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>W3 In session</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../../../packages/design-system/components/bundle.css">
<script src="../../../packages/design-system/components/bundle.js"></script>
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&amp;family=Nunito:wght@400..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="scr plain" style="width: 390px; height: 844px; gap: 18px">
  <div class="topbar">
    <a class="iconbtn" href="W2-SessionOverview.dc.html" aria-label="End session"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <div class="steps"><span style="width: 40%; background: var(--sage-ink)"></span></div>
    <span class="caption muted">2 of 5</span>
  </div>
  <div style="height: 250px; border-radius: var(--radius-lg); background: var(--sky); display: grid; place-items: center; color: var(--on-pastel); position: relative; overflow: hidden">
    <div style="position: absolute; left: -30px; right: -30px; bottom: -40px; height: 100px; border-radius: 9999px; background: var(--surface-raised); opacity: .5"></div>
    <span class="label" style="position: relative">[Exercise demo video]</span>
  </div>
  <div class="stack" style="gap: 4px">
    <h1 class="t-title">Glute bridge</h1>
    <p class="body muted">Feet flat, push through your heels, squeeze at the top for a second.</p>
  </div>
  <div class="row" style="gap: 10px">
    <div class="card" style="flex: 1; align-items: center; padding: 14px; gap: 0"><span class="t-num-md">{{setNo}}/3</span><span class="caption muted">set</span></div>
    <div class="card" style="flex: 1; align-items: center; padding: 14px; gap: 0"><span class="t-num-md">12</span><span class="caption muted">reps</span></div>
    <div class="card tint-butter" style="flex: 1; align-items: center; padding: 14px; gap: 0"><span class="t-num-md">0:45</span><span class="caption">rest next</span></div>
  </div>
  <div class="foot">
    <button type="button" class="ld-btn ld-btn--primary ld-btn--md ld-btn--block" onClick="{{nextSet}}">Done with this set</button>
    <div class="row">
      <a class="ld-btn ld-btn--secondary ld-btn--sm" href="W4-SessionDone.dc.html" style="flex: 1">Skip exercise</a>
      <button type="button" class="ld-btn ld-btn--secondary ld-btn--sm" style="flex: 1">Pause</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { set: 2 }; }
  renderVals() { return { setNo: this.state.set, nextSet: () => this.setState({ set: this.state.set >= 3 ? 1 : this.state.set + 1 }) }; }
}
</script>
</body>
</html>
