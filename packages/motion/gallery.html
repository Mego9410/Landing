<h1>Movement library</h1><p>182 looped exercises across 12 patterns, with 6 people to show them.</p>
<label>Shown by<select id="who"><option value="mix">Mix it up</option><option value="maya">Maya</option><option value="dev">Dev</option><option value="sue">Sue</option><option value="amira">Amira</option><option value="tom">Tom</option><option value="grace">Grace</option></select></label><section><h2>Squat</h2><div class="grid"><figure><svg data-id="squat-0"></svg><figcaption><b>Seated</b> Seated partial stand<small>Lean forward, nose over toes, and lift your hips just off the seat.</small></figcaption></figure><figure><svg data-id="squat-0b"></svg><figcaption><b>Seated</b> Seated cushion squeeze<small>A cushion between your knees. Squeeze it gently for a slow count of five, then relax.</small></figcaption></figure><figure><svg data-id="squat-1"></svg><figcaption><b>Level 1</b> Sit to stand, high chair<small>Hands on your thighs to help. Stand tall, then sit back slowly.</small></figcaption></figure><figure><svg data-id="squat-1b"></svg><figcaption><b>Level 1</b> Counter mini squat<small>Hands resting on the counter. Bend your knees and sit back a little, then stand tall.</small></figcaption></figure><figure><svg data-id="squat-2"></svg><figcaption><b>Level 2</b> Sit to stand<small>Arms crossed, feet flat. Stand up tall, then lower slowly to the seat.</small></figcaption></figure><figure><svg data-id="squat-2b"></svg><figcaption><b>Level 2</b> Wall slide squat<small>Back against the wall, feet a step forward. Slide down a little way, then press back up.</small></figcaption></figure><figure><svg data-id="squat-3"></svg><figcaption><b>Level 3</b> Box squat<small>Sit back until you just touch the box, then drive up through your heels.</small></figcaption></figure><figure><svg data-id="squat-3b"></svg><figcaption><b>Level 3</b> Sit to stand holding a bag<small>Hug the bag to your chest. Stand up tall, then lower slowly to the seat.</small></figcaption></figure><figure><svg data-id="squat-4"></svg><figcaption><b>Level 4</b> Goblet squat<small>Hold the weight at your chest, elbows down. Sit between your heels.</small></figcaption></figure><figure><svg data-id="squat-4b"></svg><figcaption><b>Level 4</b> Backpack squat<small>Hug the bag to your chest, elbows down. Sit between your heels, then stand.</small></figcaption></figure><figure><svg data-id="squat-4c"></svg><figcaption><b>Level 4</b> Heel-raised squat<small>Heels on a rolled towel, arms out in front. Sit straight down with your chest tall, then stand.</small></figcaption></figure><figure><svg data-id="squat-5"></svg><figcaption><b>Level 5</b> Slow goblet squat<small>Three seconds down, a short pause, then stand.</small></figcaption></figure><figure><svg data-id="squat-5b"></svg><figcaption><b>Level 5</b> Heel-raised goblet squat<small>Heels on a rolled towel, weight at your chest. Sit straight down, slow, then stand.</small></figcaption></figure><figure><svg data-id="squat-6"></svg><figcaption><b>Level 6</b> Leg press<small>Press the plate away without locking your knees, then let it come back slowly.</small></figcaption></figure><figure><svg data-id="squat-6b"></svg><figcaption><b>Level 6</b> Barbell back squat<small>Bar across your upper back, chest proud. Sit down between your heels, then drive up.</small></figcaption></figure></div></section><section><h2>Hinge</h2><div class="grid"><figure><svg data-id="hinge-0"></svg><figcaption><b>Seated</b> Seated good morning<small>Arms crossed, back long. Tip forward from your hips, then sit tall.</small></figcaption></figure><figure><svg data-id="hinge-0b"></svg><figcaption><b>Seated</b> Seated shin slide<small>Sit tall. Tip forward from your hips as your hands slide down your shins, then sit back up.</small></figcaption></figure><figure><svg data-id="hinge-1"></svg><figcaption><b>Level 1</b> Glute bridge<small>Squeeze your bottom and lift your hips until you're in a line from knees to shoulders.</small></figcaption></figure><figure><svg data-id="hinge-1b"></svg><figcaption><b>Level 1</b> Counter hip hinge<small>Hands on the counter. Push your hips back as your hands slide forward, back long, then stand tall.</small></figcaption></figure><figure><svg data-id="hinge-1c"></svg><figcaption><b>Level 1</b> Standing hip extension<small>Hands on the counter, stand tall. Take one straight leg back, squeeze your bottom, then return.</small></figcaption></figure><figure><svg data-id="hinge-2"></svg><figcaption><b>Level 2</b> Broom hinge<small>Keep the handle touching your head, back and bottom as you hinge forward.</small></figcaption></figure><figure><svg data-id="hinge-2b"></svg><figcaption><b>Level 2</b> Hip hinge to a wall<small>Stand a foot from the wall, back to it. Push your bottom back to touch it, then stand tall.</small></figcaption></figure><figure><svg data-id="hinge-3"></svg><figcaption><b>Level 3</b> Backpack Romanian deadlift<small>Soft knees. Slide the bag down your thighs, hips back, then stand tall.</small></figcaption></figure><figure><svg data-id="hinge-3b"></svg><figcaption><b>Level 3</b> Supported single-leg deadlift<small>One hand on the counter. Tip forward as one leg reaches back long, then return to tall.</small></figcaption></figure><figure><svg data-id="hinge-4"></svg><figcaption><b>Level 4</b> Dumbbell Romanian deadlift<small>Hips back, weights close to your legs. Stop when you feel the backs of your thighs.</small></figcaption></figure><figure><svg data-id="hinge-4b"></svg><figcaption><b>Level 4</b> Backpack good morning<small>Backpack on, arms crossed. Soft knees, hinge forward with a long back, then stand tall.</small></figcaption></figure><figure><svg data-id="hinge-4c"></svg><figcaption><b>Level 4</b> Staggered-stance bag deadlift<small>Front foot flat, back toes down for balance. Hinge with the bags close to your front leg, then stand.</small></figcaption></figure><figure><svg data-id="hinge-4d"></svg><figcaption><b>Level 4</b> Single-leg deadlift with a bag<small>The bag in both hands. Tip forward as one leg reaches back, hips level, then return to tall.</small></figcaption></figure><figure><svg data-id="hinge-5"></svg><figcaption><b>Level 5</b> Kettlebell deadlift<small>Bell between your feet. Push the floor away and stand up tall.</small></figcaption></figure><figure><svg data-id="hinge-5b"></svg><figcaption><b>Level 5</b> Kettlebell single-leg deadlift<small>Bell in both hands. Tip forward as one leg reaches back long, then push the floor away to stand.</small></figcaption></figure><figure><svg data-id="hinge-6"></svg><figcaption><b>Level 6</b> Hip thrust<small>Upper back on the bench, chin tucked. Drive your hips up and squeeze.</small></figcaption></figure><figure><svg data-id="hinge-6b"></svg><figcaption><b>Level 6</b> Barbell Romanian deadlift<small>Soft knees, bar close to your legs. Push your hips back until you feel your hamstrings, then stand tall.</small></figcaption></figure></div></section><section><h2>Push</h2><div class="grid"><figure><svg data-id="push-0"></svg><figcaption><b>Seated</b> Seated band chest press<small>Band round the chair back. Press forward until your arms are long, then slowly return.</small></figcaption></figure><figure><svg data-id="push-0b"></svg><figcaption><b>Seated</b> Seated wall press-up<small>Sit facing the wall, hands flat on it. Bend your elbows to lean in, then push back to tall.</small></figcaption></figure><figure><svg data-id="push-0c"></svg><figcaption><b>Seated</b> Seated palm press<small>Palms together in front of your chest. Press them firmly together as you push forward, then draw back.</small></figcaption></figure><figure><svg data-id="push-1"></svg><figcaption><b>Level 1</b> Wall press-up<small>Hands on the wall at shoulder height. Bend your elbows and bring your chest towards it.</small></figcaption></figure><figure><svg data-id="push-1b"></svg><figcaption><b>Level 1</b> Wall press-up plus<small>Arms straight, hands on the wall. Let your chest sink a little, then push the wall away so your shoulder blades spread.</small></figcaption></figure><figure><svg data-id="push-2"></svg><figcaption><b>Level 2</b> Counter press-up<small>Hands on the edge, body in one line. Lower your chest to the counter.</small></figcaption></figure><figure><svg data-id="push-2b"></svg><figcaption><b>Level 2</b> Table press-up<small>Hands on the edge of a sturdy table, body in one line. Lower your chest towards it, then press away.</small></figcaption></figure><figure><svg data-id="push-3"></svg><figcaption><b>Level 3</b> Chair press-up<small>Chair against a wall. Hands on the seat, lower with control.</small></figcaption></figure><figure><svg data-id="push-3b"></svg><figcaption><b>Level 3</b> One-arm wall press-up<small>One hand on the wall, the other on your hip. Lower your chest towards the wall, then press away.</small></figcaption></figure><figure><svg data-id="push-4"></svg><figcaption><b>Level 4</b> Knee press-up<small>Knees down, hips in line. Lower your chest between your hands.</small></figcaption></figure><figure><svg data-id="push-4b"></svg><figcaption><b>Level 4</b> Step press-up<small>Hands on a low step, body in one line from head to heels. Lower your chest to the step, then press away.</small></figcaption></figure><figure><svg data-id="push-5"></svg><figcaption><b>Level 5</b> Press-up<small>Body like a plank. Lower until your chest is just above the floor.</small></figcaption></figure><figure><svg data-id="push-5b"></svg><figcaption><b>Level 5</b> Lower-down press-up<small>From a full press-up, lower slowly for three seconds. Knees down to press up, then step back out.</small></figcaption></figure><figure><svg data-id="push-6"></svg><figcaption><b>Level 6</b> Dumbbell bench press<small>Feet flat. Lower the weights to the sides of your chest, then press up.</small></figcaption></figure><figure><svg data-id="push-6b"></svg><figcaption><b>Level 6</b> Machine chest press<small>Back against the pad, handles at chest height. Press forward without locking your elbows, then return slowly.</small></figcaption></figure></div></section><section><h2>Overhead press</h2><div class="grid"><figure><svg data-id="press-1"></svg><figcaption><b>Level 1</b> Wall slide<small>Forearms on the wall. Slide them up as high as is comfortable, then back down.</small></figcaption></figure><figure><svg data-id="press-1b"></svg><figcaption><b>Level 1</b> Broom overhead press<small>Hold a broom handle across the front of your shoulders. Press it straight up, ribs down, then lower slowly.</small></figcaption></figure><figure><svg data-id="press-2"></svg><figcaption><b>Level 2</b> Seated bottle press<small>Sit tall. Press the bottles overhead, then lower them to your shoulders.</small></figcaption></figure><figure><svg data-id="press-2b"></svg><figcaption><b>Level 2</b> Standing bottle press<small>Stand tall, a bottle in each hand. Press them overhead, then lower to your shoulders.</small></figcaption></figure><figure><svg data-id="press-3"></svg><figcaption><b>Level 3</b> Band overhead press<small>Stand on the band. Press straight up, ribs down, then lower slowly.</small></figcaption></figure><figure><svg data-id="press-3b"></svg><figcaption><b>Level 3</b> Backpack overhead press<small>Hold the bag by its sides at your chest. Press it overhead, ribs down, then lower slowly.</small></figcaption></figure><figure><svg data-id="press-3c"></svg><figcaption><b>Level 3</b> Staggered-stance one-arm press<small>One foot a little ahead, a bottle in one hand. Press it straight up, then lower to your shoulder.</small></figcaption></figure><figure><svg data-id="press-4"></svg><figcaption><b>Level 4</b> Half-kneeling dumbbell press<small>One knee down, squeeze that side's bottom. Press up, then lower with control.</small></figcaption></figure><figure><svg data-id="press-4b"></svg><figcaption><b>Level 4</b> Wall pike press<small>Hands high on the wall, hips back so your body makes an L. Bend your elbows to bring your head towards the wall, then press away.</small></figcaption></figure><figure><svg data-id="press-4c"></svg><figcaption><b>Level 4</b> One-arm backpack press<small>Hold the bag by its top handle at your shoulder. Press it overhead, ribs down, then lower slowly.</small></figcaption></figure><figure><svg data-id="press-5"></svg><figcaption><b>Level 5</b> Standing dumbbell press<small>Feet hip-width, ribs down. Press the weights overhead, then lower to your shoulders.</small></figcaption></figure><figure><svg data-id="press-5b"></svg><figcaption><b>Level 5</b> Dumbbell Arnold press<small>Start with the weights in front of your face, palms towards you. Turn them out as you press up, then reverse on the way down.</small></figcaption></figure><figure><svg data-id="press-6"></svg><figcaption><b>Level 6</b> Machine shoulder press<small>Back against the pad. Press the handles up, then lower slowly.</small></figcaption></figure><figure><svg data-id="press-6b"></svg><figcaption><b>Level 6</b> Barbell overhead press<small>Bar at the front of your shoulders, ribs down. Press it straight up, head through at the top, then lower.</small></figcaption></figure></div></section><section><h2>Row</h2><div class="grid"><figure><svg data-id="row-1"></svg><figcaption><b>Level 1</b> Prone Y raise<small>Lying face down, arms in a Y. Lift your arms a little, forehead stays low.</small></figcaption></figure><figure><svg data-id="row-1b"></svg><figcaption><b>Level 1</b> Back-to-wall elbow press<small>Back to the wall, elbows bent at your sides. Press your elbows back into the wall, hold for five, then relax.</small></figcaption></figure><figure><svg data-id="row-1c"></svg><figcaption><b>Level 1</b> Seated towel row<small>Towel round the soles of your feet, legs long. Pull your elbows back and squeeze your shoulder blades.</small></figcaption></figure><figure><svg data-id="row-2"></svg><figcaption><b>Level 2</b> Seated band row<small>Sit tall. Pull your elbows back and squeeze your shoulder blades.</small></figcaption></figure><figure><svg data-id="row-2b"></svg><figcaption><b>Level 2</b> Supported bottle row<small>One hand on the counter, back long. Pull the bottle up towards your ribs, then lower slowly.</small></figcaption></figure><figure><svg data-id="row-2c"></svg><figcaption><b>Level 2</b> Bent-over bottle row<small>Soft knees, hinge forward with a long back. Pull both bottles up towards your ribs, then lower slowly.</small></figcaption></figure><figure><svg data-id="row-3"></svg><figcaption><b>Level 3</b> Standing band row<small>Soft knees, chest proud. Pull your elbows past your ribs.</small></figcaption></figure><figure><svg data-id="row-3b"></svg><figcaption><b>Level 3</b> Supported backpack row<small>One hand on the counter, back long. Pull the bag up towards your hip, then lower slowly.</small></figcaption></figure><figure><svg data-id="row-3c"></svg><figcaption><b>Level 3</b> Bent-over backpack row<small>Hold the bag by its straps, back long. Pull it up to your tummy, then lower slowly.</small></figcaption></figure><figure><svg data-id="row-4"></svg><figcaption><b>Level 4</b> One-arm dumbbell row<small>Hand on the bench, back flat. Pull the weight to your hip.</small></figcaption></figure><figure><svg data-id="row-4b"></svg><figcaption><b>Level 4</b> Bent-over bag row<small>A loaded bag in each hand, hinge forward with a flat back. Pull the bags up to your ribs, then lower slowly.</small></figcaption></figure><figure><svg data-id="row-4c"></svg><figcaption><b>Level 4</b> Chair-supported bag row<small>One hand on a sturdy chair, back flat. Pull the bag up to your hip, then lower slowly.</small></figcaption></figure><figure><svg data-id="row-5"></svg><figcaption><b>Level 5</b> Table row<small>Under a sturdy table, heels down, body straight. Pull your chest to the edge.</small></figcaption></figure><figure><svg data-id="row-5b"></svg><figcaption><b>Level 5</b> Table row, knees bent<small>Under a sturdy table, knees bent and feet flat. Pull your chest up to the edge, then lower slowly.</small></figcaption></figure><figure><svg data-id="row-6"></svg><figcaption><b>Level 6</b> Seated cable row<small>Sit tall, knees soft. Pull the handle to your ribs, then let your arms go long.</small></figcaption></figure><figure><svg data-id="row-6b"></svg><figcaption><b>Level 6</b> Barbell bent-over row<small>Hinge forward with a flat back, bar hanging. Pull it to your lower ribs, then lower with control.</small></figcaption></figure></div></section><section><h2>Pull down</h2><div class="grid"><figure><svg data-id="pulldown-1"></svg><figcaption><b>Level 1</b> Overhead band pull-apart<small>Arms up, band taut. Pull it apart and down behind your head.</small></figcaption></figure><figure><svg data-id="pulldown-1b"></svg><figcaption><b>Level 1</b> Wall angel<small>Back and head against the wall. Slide your arms up as high as is comfortable, then draw your elbows down to your sides.</small></figcaption></figure><figure><svg data-id="pulldown-1c"></svg><figcaption><b>Level 1</b> Seated towel pull-down<small>Hold a towel overhead, hands wide, pulling it tight. Draw your elbows down to your sides, then reach back up.</small></figcaption></figure><figure><svg data-id="pulldown-2"></svg><figcaption><b>Level 2</b> Seated band pull-down<small>Band over the top of a door. Pull your elbows down to your sides.</small></figcaption></figure><figure><svg data-id="pulldown-2b"></svg><figcaption><b>Level 2</b> Towel pull-down<small>Stand tall, a towel overhead pulled tight. Draw your elbows down to your sides, keep the pull, then reach back up.</small></figcaption></figure><figure><svg data-id="pulldown-2c"></svg><figcaption><b>Level 2</b> Straight-arm towel pull-down<small>Lean forward a little, towel pulled tight, arms long. Sweep it down to your thighs, elbows straight, then back up.</small></figcaption></figure><figure><svg data-id="pulldown-3"></svg><figcaption><b>Level 3</b> Kneeling band pull-down<small>Tall kneeling, bottom squeezed. Pull your elbows down and back.</small></figcaption></figure><figure><svg data-id="pulldown-3b"></svg><figcaption><b>Level 3</b> Standing band pull-down<small>Band over the top of a door. Stand tall and pull your elbows down to your sides.</small></figcaption></figure><figure><svg data-id="pulldown-3c"></svg><figcaption><b>Level 3</b> Straight-arm band pull-down<small>Band anchored high in front. Arms long, sweep your hands down to your thighs, then let them rise slowly.</small></figcaption></figure><figure><svg data-id="pulldown-4"></svg><figcaption><b>Level 4</b> Assisted pull-up<small>Feet on the chair to take some weight. Pull your chest up towards the bar.</small></figcaption></figure><figure><svg data-id="pulldown-4b"></svg><figcaption><b>Level 4</b> Straight-arm cable pull-down<small>Pulley set high. Arms long, sweep the bar down to your thighs, then let it rise slowly.</small></figcaption></figure><figure><svg data-id="pulldown-5"></svg><figcaption><b>Level 5</b> Lat pull-down<small>Thighs under the pad. Pull the bar to your upper chest, then let it rise slowly.</small></figcaption></figure><figure><svg data-id="pulldown-5b"></svg><figcaption><b>Level 5</b> Single-arm cable pull-down<small>Pulley above you. Pull your elbow down to your side, then let your arm rise all the way.</small></figcaption></figure><figure><svg data-id="pulldown-6"></svg><figcaption><b>Level 6</b> Chin-up<small>Hang long, then pull until your chin clears the bar. Lower all the way.</small></figcaption></figure><figure><svg data-id="pulldown-6b"></svg><figcaption><b>Level 6</b> Slow lowering chin-up<small>Step up so your chin is by the bar. Lower yourself as slowly as you can, then step back up.</small></figcaption></figure></div></section><section><h2>Lunge and step</h2><div class="grid"><figure><svg data-id="lunge-0"></svg><figcaption><b>Seated</b> Seated knee extension<small>Sit tall. Straighten one knee, pause, and lower slowly.</small></figcaption></figure><figure><svg data-id="lunge-0b"></svg><figcaption><b>Seated</b> Seated straight-leg lift<small>Sit tall, one leg out straight with the heel down. Lift it a little, pause, and lower slowly.</small></figcaption></figure><figure><svg data-id="lunge-1"></svg><figcaption><b>Level 1</b> Supported split stance<small>One foot forward, hand on the counter. Bend both knees a little and hold.</small></figcaption></figure><figure><svg data-id="lunge-1b"></svg><figcaption><b>Level 1</b> Step taps<small>Stand tall in front of a low step. Tap one foot on top, bring it back, then the other.</small></figcaption></figure><figure><svg data-id="lunge-2"></svg><figcaption><b>Level 2</b> Supported split squat<small>Lower your back knee towards the floor, then push back up.</small></figcaption></figure><figure><svg data-id="lunge-2b"></svg><figcaption><b>Level 2</b> Supported back step<small>Hand on the counter. Step one foot back, bend both knees a little, then step in again.</small></figcaption></figure><figure><svg data-id="lunge-3"></svg><figcaption><b>Level 3</b> Step-up<small>Whole foot on the step. Push through it to stand up, then step down.</small></figcaption></figure><figure><svg data-id="lunge-3b"></svg><figcaption><b>Level 3</b> Split squat<small>One foot forward, hands on your hips. Lower your back knee towards the floor, then push back up.</small></figcaption></figure><figure><svg data-id="lunge-4"></svg><figcaption><b>Level 4</b> Reverse lunge<small>Step back and lower your back knee towards the floor. Push through your front foot to return.</small></figcaption></figure><figure><svg data-id="lunge-4b"></svg><figcaption><b>Level 4</b> Backpack step-up<small>Backpack on. Whole foot on the step, push through it to stand up, then step down slowly.</small></figcaption></figure><figure><svg data-id="lunge-5"></svg><figcaption><b>Level 5</b> Dumbbell split squat<small>Weights by your sides. Drop your back knee straight down, then stand.</small></figcaption></figure><figure><svg data-id="lunge-5b"></svg><figcaption><b>Level 5</b> Chair Bulgarian split squat<small>Back foot on a chair behind you. Lower until your front thigh is nearly level, then stand.</small></figcaption></figure><figure><svg data-id="lunge-5c"></svg><figcaption><b>Level 5</b> Backpack reverse lunge<small>Backpack on. Step back and lower your back knee towards the floor, then push through your front foot to return.</small></figcaption></figure><figure><svg data-id="lunge-6"></svg><figcaption><b>Level 6</b> Bulgarian split squat<small>Back foot on the bench. Lower until your front thigh is nearly level.</small></figcaption></figure><figure><svg data-id="lunge-6b"></svg><figcaption><b>Level 6</b> Barbell reverse lunge<small>Bar across your upper back. Step back into a lunge, then drive through your front foot to stand.</small></figcaption></figure></div></section><section><h2>Carry</h2><div class="grid"><figure><svg data-id="carry-0"></svg><figcaption><b>Seated</b> Seated hold<small>Sit tall with a bag in each hand. Shoulders back and down, breathe and hold.</small></figcaption></figure><figure><svg data-id="carry-0b"></svg><figcaption><b>Seated</b> Seated backpack hug<small>Sit tall, hugging a loaded bag to your chest. Shoulders down, breathe and hold.</small></figcaption></figure><figure><svg data-id="carry-1"></svg><figcaption><b>Level 1</b> Bottle walk<small>A bottle in each hand. Walk tall, slow and steady.</small></figcaption></figure><figure><svg data-id="carry-1b"></svg><figcaption><b>Level 1</b> Backpack walk<small>A loaded backpack on both shoulders. Walk tall, slow and steady.</small></figcaption></figure><figure><svg data-id="carry-2"></svg><figcaption><b>Level 2</b> Shopping bag carry<small>A bag in each hand, shoulders down. Walk tall and keep the bags still.</small></figcaption></figure><figure><svg data-id="carry-2b"></svg><figcaption><b>Level 2</b> One-bag carry<small>One loaded bag in one hand. Walk tall and don't let it pull you sideways.</small></figcaption></figure><figure><svg data-id="carry-3"></svg><figcaption><b>Level 3</b> Suitcase carry<small>Weight in one hand. Don't let it pull you sideways.</small></figcaption></figure><figure><svg data-id="carry-3b"></svg><figcaption><b>Level 3</b> Waiter carry<small>A full bottle held straight up overhead. Ribs down, walk slowly.</small></figcaption></figure><figure><svg data-id="carry-3c"></svg><figcaption><b>Level 3</b> Backpack front carry<small>Hug a loaded bag to your chest, elbows in. Walk tall and breathe.</small></figcaption></figure><figure><svg data-id="carry-4"></svg><figcaption><b>Level 4</b> Farmer's carry<small>Heavy weights, tall posture, small steady steps.</small></figcaption></figure><figure><svg data-id="carry-4b"></svg><figcaption><b>Level 4</b> Backpack and bags walk<small>Backpack on and a bag in each hand. Tall posture, small steady steps.</small></figcaption></figure><figure><svg data-id="carry-4c"></svg><figcaption><b>Level 4</b> Marching bag hold<small>A loaded bag in each hand. March slowly on the spot, knees up, staying tall.</small></figcaption></figure><figure><svg data-id="carry-5"></svg><figcaption><b>Level 5</b> Kettlebell carry<small>Grip hard, shoulders down, walk slowly.</small></figcaption></figure><figure><svg data-id="carry-5b"></svg><figcaption><b>Level 5</b> Kettlebell waiter carry<small>Bell held straight up overhead, wrist strong. Ribs down, walk slowly.</small></figcaption></figure><figure><svg data-id="carry-6"></svg><figcaption><b>Level 6</b> Front-rack carry<small>Bells at your chest, elbows tucked. Breathe and walk.</small></figcaption></figure><figure><svg data-id="carry-6b"></svg><figcaption><b>Level 6</b> Mixed carry<small>One bell at your chest, one by your side. Stay level and walk slowly.</small></figcaption></figure></div></section><section><h2>Core</h2><div class="grid"><figure><svg data-id="core-0"></svg><figcaption><b>Seated</b> Seated lean-back<small>Arms crossed, sit tall. Lean back a little, hold, then come forward.</small></figcaption></figure><figure><svg data-id="core-0b"></svg><figcaption><b>Seated</b> Seated dead bug<small>Sit tall, leaning back a touch, arms forward. n one line. Breathe and hold.</small></figcaption></figure><figure><svg data-id="core-4c"></svg><figcaption><b>Level 4</b> Counter plank with reach<small>Hands on the counter, body in one line. Reach one arm forward without letting your hips turn, then swap.</small></figcaption></figure><figure><svg data-id="core-5"></svg><figcaption><b>Level 5</b> Plank with reach<small>Hold the plank and reach one arm forward without letting your hips rock.</small></figcaption></figure><figure><svg data-id="core-5b"></svg><figcaption><b>Level 5</b> Chair plank knee drive<small>Hands on the chair seat, body in one line. Slowly bring one knee in, step it back, then the other.</small></figcaption></figure><figure><svg data-id="core-5c"></svg><figcaption><b>Level 5</b> Chair plank with reach<small>Hands on the chair seat, body in one line. Reach one arm forward, hips still, then swap.</small></figcaption></figure><figure><svg data-id="core-6"></svg><figcaption><b>Level 6</b> Ab wheel rollout<small>From your knees, roll out only as far as you can keep your back flat.</small></figcaption></figure></div></section><section><h2>Side and rotation</h2><div class="grid"><figure><svg data-id="rotation-0"></svg><figcaption><b>Seated</b> Seated band press-out<small>Band anchored to one side. Press it out in front and don't let it turn you.</small></figcaption></figure><figure><svg data-id="rotation-1"></svg><figcaption><b>Level 1</b> Seated march<small>Sit tall, tummy braced. Lift one knee, lower, then the other.</small></figcaption></figure><figure><svg data-id="rotation-1b"></svg><figcaption><b>Level 1</b> Seated bottle halo<small>Sit tall, a bottle in both hands. Circle it slowly round your head, then go the other way.</small></figcaption></figure><figure><svg data-id="rotation-2"></svg><figcaption><b>Level 2</b> Bird dog<small>On all fours. Reach one arm forward and the opposite leg back, then swap.</small></figcaption></figure><figure><svg data-id="rotation-2b"></svg><figcaption><b>Level 2< a-id="rotation-5c"></svg><figcaption><b>Level 5</b> Backpack lift<small>Squat with the bag by one hip. Stand and lift it up across your body, over the other shoulder, then lower back down.</small></figcaption></figure><figure><svg data-id="rotation-6"></svg><figcaption><b>Level 6</b> Half-kneeling chop<small>Pull the band from high behind you down across your body, hips still.</small></figcaption></figure><figure><svg data-id="rotation-6b"></svg><figcaption><b>Level 6</b> Standing band chop<small>Band anchored high behind you. Pull it down across your body, turning through your middle, hips facing forward.</small></figcaption></figure></div></section><section><h2>Balance</h2><div class="grid"><figure><svg data-id="balance-0"></svg><figcaption><b>Seated</b> Seated reach<small>Sit tall, feet flat. Reach forward as far as feels steady, then sit back.</small></figcaption></figure><figure><svg data-id="balance-0b"></svg><figcaption><b>Seated</b> Seated heel-toe rock<small>Sit tall, feet flat. Lift your toes, then roll forward and lift your heels. Keep it slow.</small></figcaption></figure><figure><svg data-id="balance-1"></svg><figcaption><b>Level 1</b> Feet together, with support<small>Feet together, a hand near the counter. Stand tall and breathe.</small></figcaption></figure><figure><svg data-id="balance-1b"></svg><figcaption><b>Level 1</b> Supported rock forward and back<small>Fingertips on the counter. Rock onto your toes, then back onto your heels, slow and small.</small></figcaption></figure><figure><svg data-id="balance-1c"></svg><figcaption><b>Level 1</b> Supported march<small>Fingertips on the counter. March slowly on the spot, lifting each knee a little.</small></figcaption></figure><figure><svg data-id="balance-2"></svg><figcaption><b>Level 2</b> Heel-to-toe stand, with support<small>One foot directly in front of the other. Hold steady.</small></figcaption></figure><figure><svg data-id="balance-2b"></svg><figcaption><b>Level 2</b> Heel-to-toe walk, with support<small>A hand along the counter. Heel touches toe with every step, eyes ahead.</small></figcaption></figure><figure><svg data-id="balance-3"></svg><figcaption><b>Level 3</b> Single-leg stand, with support<small>Lift one foot, a fingertip on the counter. Hold.</small></figcaption></figure><figure><svg data-id="balance-3b"></svg><figcaption><b>Level 3</b> Single-leg reach, with support<small>Standing on one leg, a hand on the counter. Reach the other arm forward slowly, then back.</small></figcaption></figure><figure><svg data-id="balance-3c"></svg><figcaption><b>Level 3</b> Single-leg toe taps, with support<small>Standing on one leg, a hand on the counter. Tap the other toe forward, then back, without putting weight on it.</small></figcaption></figure><figure><svg data-id="balance-4"></svg><figcaption><b>Level 4</b> Heel-to-toe walk<small>Heel touches toe with every step. Eyes ahead, arms out a little.</small></figcaption></figure><figure><svg data-id="balance-5"></svg><figcaption><b>Level 5</b> Single-leg reach<small>Standing on one leg, tip forward and reach, back leg long. Return to tall.</small></figcaption></figure><figure><svg data-id="balance-6"></svg><figcaption><b>Level 6</b> Single-leg stand on a cushion<small>One foot on the cushion, arms out a little. Hold steady.</small></figcaption></figure></div></section><section><h2>Calf</h2><div class="grid"><figure><svg data-id="calf-1"></svg><figcaption><b>Level 1</b> Seated heel raise<small>Feet flat. Lift your heels as high as you can, then lower slowly.</small></figcaption></figure><figure><svg data-id="calf-1b"></svg><figcaption><b>Level 1</b> Standing toe raise<small>Fingertips on the counter. Lift the fronts of your feet, heels down, then lower slowly.</small></figcaption></figure><figure><svg data-id="calf-2"></svg><figcaption><b>Level 2</b> Standing heel raise<small>Fingertips on the counter. Rise onto the balls of your feet, then lower.</small></figcaption></figure><figure><svg data-id="calf-2b"></svg>< <script>
var M = window.LandingMotion, who = document.getElementById("who"), live = [], io = null;
function start() {
  live.forEach(function (m) { m.destroy(); });
  live = Array.prototype.map.call(document.querySelectorAll("svg[data-id]"), function (el) {
    var id = el.getAttribute("data-id");
    var m = M.mount(el, { id: id, who: who.value === "mix" ? M.mixFor(id) : who.value, paused: true });
    m.el = el;
    return m;
  });
  // Only animate the cards on screen.
  if (io) io.disconnect();
  io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) { live.forEach(function (m) { if (m.el === en.target) m.update({ paused: !en.isIntersecting }); }); });
  });
  live.forEach(function (m) { io.observe(m.el); });
}
who.addEventListener("change", start);
start();
</script></html>
