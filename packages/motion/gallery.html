<!doctype html><html lang="en-GB"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movement library</title>
<style>body{margin:0;padding:24px 16px;font:15px/1.4 system-ui,sans-serif;background:#FBF8F4;color:#2E2A33}h1,h2{font-weight:600}h2{margin:32px 0 12px}
label{font-weight:700}select{font:inherit;margin-left:8px;padding:4px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}figure{margin:0;background:#fff;border-radius:16px;overflow:hidden}
svg{display:block;width:100%;aspect-ratio:270/224;background:#CCE2EF}figcaption{padding:10px 12px}b{display:block;font-size:12px;color:#5A4A8E}small{display:block;color:#6A6371;margin-top:4px}</style>
<h1>Movement library</h1><p>81 looped exercises across 12 patterns, with 6 people to show them.</p>
<label>Shown by<select id="who"><option value="mix">Mix it up</option><option value="maya">Maya</option><option value="dev">Dev</option><option value="sue">Sue</option><option value="amira">Amira</option><option value="tom">Tom</option><option value="grace">Grace</option></select></label><section><h2>Squat</h2><div class="grid"><figure><svg data-id="squat-0"></svg><figcaption><b>Seated</b> Seated partial stand<small>Lean forward, nose over toes, and lift your hips just off the seat.</small></figcaption></figure><figure><svg data-id="squat-1"></svg><figcaption><b>Level 1</b> Sit to stand, high chair<small>Hands on your thighs to help. Stand tall, then sit back slowly.</small></figcaption></figure><figure><svg data-id="squat-2"></svg><figcaption><b>Level 2</b> Sit to stand<small>Arms crossed, feet flat. Stand up tall, then lower slowly to the seat.</small></figcaption></figure><figure><svg data-id="squat-3"></svg><figcaption><b>Level 3</b> Box squat<small>Sit back until you just touch the box, then drive up through your heels.</small></figcaption></figure><figure><svg data-id="squat-4"></svg><figcaption><b>Level 4</b> Goblet squat<small>Hold the weight at your chest, elbows down. Sit between your heels.</small></figcaption></figure><figure><svg data-id="squat-5"></svg><figcaption><b>Level 5</b> Slow goblet squat<small>Three seconds down, a short pause, then stand.</small></figcaption></figure><figure><svg data-id="squat-6"></svg><figcaption><b>Level 6</b> Leg press<small>Press the plate away without locking your knees, then let it come back slowly.</small></figcaption></figure></div></section><section><h2>Hinge</h2><div class="grid"><figure><svg data-id="hinge-0"></svg><figcaption><b>Seated</b> Seated good morning<small>Arms crossed, back long. Tip forward from your hips, then sit tall.</small></figcaption></figure><figure><svg data-id="hinge-1"></svg><figcaption><b>Level 1</b> Glute bridge<small>Squeeze your bottom and lift your hips until you're in a line from knees to shoulders.</small></figcaption></figure><figure><svg data-id="hinge-2"></svg><figcaption><b>Level 2</b> Broom hinge<small>Keep the handle touching your head, back and bottom as you hinge forward.</small></figcaption></figure><figure><svg data-id="hinge-3"></svg><figcaption><b>Level 3</b> Backpack Romanian deadlift<small>Soft knees. Slide the bag down your thighs, hips back, then stand tall.</small></figcaption></figure><figure><svg data-id="hinge-4"></svg><figcaption><b>Level 4</b> Dumbbell Romanian deadlift<small>Hips back, weights close to your legs. Stop when you feel the backs of your thighs.</small></figcaption></figure><figure><svg data-id="hinge-5"></svg><figcaption><b>Level 5</b> Kettlebell deadlift<small>Bell between your feet. Push the floor away and stand up tall.</small></figcaption></figure><figure><svg data-id="hinge-6"></svg><figcaption><b>Level 6</b> Hip thrust<small>Upper back on the bench, chin tucked. Drive your hips up and squeeze.</small></figcaption></figure></div></section><section><h2>Push</h2><div class="grid"><figure><svg data-id="push-0"></svg><figcaption><b>Seated</b> Seated band chest press<small>Band round the chair back. Press forward until your arms are long, then slowly return.</small></figcaption></figure><figure><svg data-id="push-1"></svg><figcaption><b>Level 1</b> Wall press-up<small>Hands on the wall at shoulder height. Bend your elbows and bring your chest towards it.</small></figcaption></figure><figure><svg data-id="push-2"></svg><figcaption><b>Level 2</b> Counter press-up<small>Hands on the edge, body in one line. Lower your chest to the counter.</small></figcaption></figure><figure><svg data-id="push-3"></svg><figcaption><b>Level 3</b> Chair press-up<small>Chair against a wall. Hands on the seat, lower with control.</small></figcaption></figure><figure><svg data-id="push-4"></svg><figcaption><b>Level 4</b> Knee press-up<small>Knees down, hips in line. Lower your chest between your hands.</small></figcaption></figure><figure><svg data-id="push-5"></svg><figcaption><b>Level 5</b> Press-up<small>Body like a plank. Lower until your chest is just above the floor.</small></figcaption></figure><figure><svg data-id="push-6"></svg><figcaption><b>Level 6</b> Dumbbell bench press<small>Feet flat. Lower the weights to the sides of your chest, then press up.</small></figcaption></figure></div></section><section><h2>Overhead press</h2><div class="grid"><figure><svg data-id="press-1"></svg><figcaption><b>Level 1</b> Wall slide<small>Forearms on the wall. Slide them up as high as is comfortable, then back down.</small></figcaption></figure><figure><svg data-id="press-2"></svg><figcaption><b>Level 2</b> Seated bottle press<small>Sit tall. Press the bottles overhead, then lower them to your shoulders.</small></figcaption></figure><figure><svg data-id="press-3"></svg><figcaption><b>Level 3</b> Band overhead press<small>Stand on the band. Press straight up, ribs down, then lower slowly.</small></figcaption></figure><figure><svg data-id="press-4"></svg><figcaption><b>Level 4</b> Half-kneeling dumbbell press<small>One knee down, squeeze that side's bottom. Press up, then lower with control.</small></figcaption></figure><figure><svg data-id="press-5"></svg><figcaption><b>Level 5</b> Standing dumbbell press<small>Feet hip-width, ribs down. Press the weights overhead, then lower to your shoulders.</small></figcaption></figure><figure><svg data-id="press-6"></svg><figcaption><b>Level 6</b> Machine shoulder press<small>Back against the pad. Press the handles up, then lower slowly.</small></figcaption></figure></div></section><section><h2>Row</h2><div class="grid"><figure><svg data-id="row-1"></svg><figcaption><b>Level 1</b> Prone Y raise<small>Lying face down, arms in a Y. Lift your arms a little, forehead stays low.</small></figcaption></figure><figure><svg data-id="row-2"></svg><figcaption><b>Level 2</b> Seated band row<small>Sit tall. Pull your elbows back and squeeze your shoulder blades.</small></figcaption></figure><figure><svg data-id="row-2b"></svg><figcaption><b>Level 2</b> Supported bottle row<small>One hand on the counter, back long. Pull the bottle up towards your ribs, then lower slowly.</small></figcaption></figure><figure><svg data-id="row-3"></svg><figcaption><b>Level 3</b> Standing band row<small>Soft knees, chest proud. Pull your elbows past your ribs.</small></figcaption></figure><figure><svg data-id="row-4"></svg><figcaption><b>Level 4</b> One-arm dumbbell row<small>Hand on the bench, back flat. Pull the weight to your hip.</small></figcaption></figure><figure><svg data-id="row-5"></svg><figcaption><b>Level 5</b> Table row<small>Under a sturdy table, heels down, body straight. Pull your chest to the edge.</small></figcaption></figure><figure><svg data-id="row-6"></svg><figcaption><b>Level 6</b> Seated cable row<small>Sit tall, knees soft. Pull the handle to your ribs, then let your arms go long.</small></figcaption></figure></div></section><section><h2>Pull down</h2><div class="grid"><figure><svg data-id="pulldown-1"></svg><figcaption><b>Level 1</b> Overhead band pull-apart<small>Arms up, band taut. Pull it apart and down behind your head.</small></figcaption></figure><figure><svg data-id="pulldown-2"></svg><figcaption><b>Level 2</b> Seated band pull-down<small>Band over the top of a door. Pull your elbows down to your sides.</small></figcaption></figure><figure><svg data-id="pulldown-3"></svg><figcaption><b>Level 3</b> Kneeling band pull-down<small>Tall kneeling, bottom squeezed. Pull your elbows down and back.</small></figcaption></figure><figure><svg data-id="pulldown-4"></svg><figcaption><b>Level 4</b> Assisted pull-up<small>Feet on the chair to take some weight. Pull your chest up towards the bar.</small></figcaption></figure><figure><svg data-id="pulldown-5"></svg><figcaption><b>Level 5</b> Lat pull-down<small>Thighs under the pad. Pull the bar to your upper chest, then let it rise slowly.</small></figcaption></figure><figure><svg data-id="pulldown-6"></svg><figcaption><b>Level 6</b> Chin-up<small>Hang long, then pull until your chin clears the bar. Lower all the way.</small></figcaption></figure></div></section><section><h2>Lunge and step</h2><div class="grid"><figure><svg data-id="lunge-0"></svg><figcaption><b>Seated</b> Seated knee extension<small>Sit tall. Straighten one knee, pause, and lower slowly.</small></figcaption></figure><figure><svg data-id="lunge-1"></svg><figcaption><b>Level 1</b> Supported split stance<small>One foot forward, hand on the counter. Bend both knees a little and hold.</small></figcaption></figure><figure><svg data-id="lunge-2"></svg><figcaption><b>Level 2</b> Supported split squat<small>Lower your back knee towards the floor, then push back up.</small></figcaption></figure><figure><svg data-id="lunge-3"></svg><figcaption><b>Level 3</b> Step-up<small>Whole foot on the step. Push through it to stand up, then step down.</small></figcaption></figure><figure><svg data-id="lunge-4"></svg><figcaption><b>Level 4</b> Reverse lunge<small>Step back and lower your back knee towards the floor. Push through your front foot to return.</small></figcaption></figure><figure><svg data-id="lunge-5"></svg><figcaption><b>Level 5</b> Dumbbell split squat<small>Weights by your sides. Drop your back knee straight down, then stand.</small></figcaption></figure><figure><svg data-id="lunge-6"></svg><figcaption><b>Level 6</b> Bulgarian split squat<small>Back foot on the bench. Lower until your front thigh is nearly level.</small></figcaption></figure></div></section><section><h2>Carry</h2><div class="grid"><figure><svg data-id="carry-0"></svg><figcaption><b>Seated</b> Seated hold<small>Sit tall with a bag in each hand. Shoulders back and down, breathe and hold.</small></figcaption></figure><figure><svg data-id="carry-1"></svg><figcaption><b>Level 1</b> Bottle walk<small>A bottle in each hand. Walk tall, slow and steady.</small></figcaption></figure><figure><svg data-id="carry-2"></svg><figcaption><b>Level 2</b> Shopping bag carry<small>A bag in each hand, shoulders down. Walk tall and keep the bags still.</small></figcaption></figure><figure><svg data-id="carry-3"></svg><figcaption><b>Level 3</b> Suitcase carry<small>Weight in one hand. Don't let it pull you sideways.</small></figcaption></figure><figure><svg data-id="carry-4"></svg><figcaption><b>Level 4</b> Farmer's carry<small>Heavy weights, tall posture, small steady steps.</small></figcaption></figure><figure><svg data-id="carry-5"></svg><figcaption><b>Level 5</b> Kettlebell carry<small>Grip hard, shoulders down, walk slowly.</small></figcaption></figure><figure><svg data-id="carry-6"></svg><figcaption><b>Level 6</b> Front-rack carry<small>Bells at your chest, elbows tucked. Breathe and walk.</small></figcaption></figure></div></section><section><h2>Core</h2><div class="grid"><figure><svg data-id="core-0"></svg><figcaption><b>Seated</b> Seated lean-back<small>Arms crossed, sit tall. Lean back a little, hold, then come forward.</small></figcaption></figure><figure><svg data-id="core-1"></svg><figcaption><b>Level 1</b> Heel slide<small>Lower back gently pressed down. Slide one heel away, then back.</small></figcaption></figure><figure><svg data-id="core-2"></svg><figcaption><b>Level 2</b> Dead bug<small>Back flat. Reach one arm back and the opposite leg out, then swap.</small></figcaption></figure><figure><svg data-id="core-3"></svg><figcaption><b>Level 3</b> Incline plank<small>Hands on the counter, body in one line. Breathe and hold.</small></figcaption></figure><figure><svg data-id="core-4"></svg><figcaption><b>Level 4</b> Knee plank<small>Forearms down, knees down, hips in line with your shoulders. Hold.</small></figcaption></figure><figure><svg data-id="core-5"></svg><figcaption><b>Level 5</b> Plank with reach<small>Hold the plank and reach one arm forward without letting your hips rock.</small></figcaption></figure><figure><svg data-id="core-6"></svg><figcaption><b>Level 6</b> Ab wheel rollout<small>From your knees, roll out only as far as you can keep your back flat.</small></figcaption></figure></div></section><section><h2>Side and rotation</h2><div class="grid"><figure><svg data-id="rotation-0"></svg><figcaption><b>Seated</b> Seated band press-out<small>Band anchored to one side. Press it out in front and don't let it turn you.</small></figcaption></figure><figure><svg data-id="rotation-1"></svg><figcaption><b>Level 1</b> Seated march<small>Sit tall, tummy braced. Lift one knee, lower, then the other.</small></figcaption></figure><figure><svg data-id="rotation-2"></svg><figcaption><b>Level 2</b> Bird dog<small>On all fours. Reach one arm forward and the opposite leg back, then swap.</small></figcaption></figure><figure><svg data-id="rotation-3"></svg><figcaption><b>Level 3</b> Knee side plank<small>On your side, knees bent. Lift your hips and hold.</small></figcaption></figure><figure><svg data-id="rotation-4"></svg><figcaption><b>Level 4</b> Pallof press<small>Band anchored at your side, chest height. Press out and resist the turn.</small></figcaption></figure><figure><svg data-id="rotation-5"></svg><figcaption><b>Level 5</b> Side plank<small>Elbow under shoulder, feet stacked. Lift your hips into a straight line.</small></figcaption></figure><figure><svg data-id="rotation-6"></svg><figcaption><b>Level 6</b> Half-kneeling chop<small>Pull the band from high behind you down across your body, hips still.</small></figcaption></figure></div></section><section><h2>Balance</h2><div class="grid"><figure><svg data-id="balance-0"></svg><figcaption><b>Seated</b> Seated reach<small>Sit tall, feet flat. Reach forward as far as feels steady, then sit back.</small></figcaption></figure><figure><svg data-id="balance-1"></svg><figcaption><b>Level 1</b> Feet together, with support<small>Feet together, a hand near the counter. Stand tall and breathe.</small></figcaption></figure><figure><svg data-id="balance-2"></svg><figcaption><b>Level 2</b> Heel-to-toe stand, with support<small>One foot directly in front of the other. Hold steady.</small></figcaption></figure><figure><svg data-id="balance-3"></svg><figcaption><b>Level 3</b> Single-leg stand, with support<small>Lift one foot, a fingertip on the counter. Hold.</small></figcaption></figure><figure><svg data-id="balance-4"></svg><figcaption><b>Level 4</b> Heel-to-toe walk<small>Heel touches toe with every step. Eyes ahead, arms out a little.</small></figcaption></figure><figure><svg data-id="balance-5"></svg><figcaption><b>Level 5</b> Single-leg reach<small>Standing on one leg, tip forward and reach, back leg long. Return to tall.</small></figcaption></figure><figure><svg data-id="balance-6"></svg><figcaption><b>Level 6</b> Single-leg stand on a cushion<small>One foot on the cushion, arms out a little. Hold steady.</small></figcaption></figure></div></section><section><h2>Calf</h2><div class="grid"><figure><svg data-id="calf-1"></svg><figcaption><b>Level 1</b> Seated heel raise<small>Feet flat. Lift your heels as high as you can, then lower slowly.</small></figcaption></figure><figure><svg data-id="calf-2"></svg><figcaption><b>Level 2</b> Standing heel raise<small>Fingertips on the counter. Rise onto the balls of your feet, then lower.</small></figcaption></figure><figure><svg data-id="calf-3"></svg><figcaption><b>Level 3</b> Slow heel raise on a step<small>Balls of your feet on the edge. Lower your heels slowly below the step, then rise.</small></figcaption></figure><figure><svg data-id="calf-4"></svg><figcaption><b>Level 4</b> Single-leg heel raise, supported<small>One foot hooked behind. Rise up, then lower with control.</small></figcaption></figure><figure><svg data-id="calf-5"></svg><figcaption><b>Level 5</b> Single-leg heel raise, 3-2-3<small>Three seconds up, hold for two, three seconds down.</small></figcaption></figure><figure><svg data-id="calf-6"></svg><figcaption><b>Level 6</b> Weighted single-leg heel raise<small>Weight in your free hand. Full range, slow on the way down.</small></figcaption></figure></div></section>
<script src="dist/landing-motion.js"></script>
<script>
var M = window.LandingMotion, who = document.getElementById("who"), live = [], io = null;
function start() {
  live.forEach(function (m) { m.destroy(); });
  live = Array.prototype.map.call(document.querySelectorAll("svg[data-id]"), function (el) {
    var id = el.getAttribute("data-id");
    var m = M.mount(el, { id: id, who: who.value === "mix" ? M.mixFor(id) : who.value, paused: true });
    m.el = el;
    return m;
  });
  // Only animate the cards on screen.
  if (io) io.disconnect();
  io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) { live.forEach(function (m) { if (m.el === en.target) m.update({ paused: !en.isIntersecting }); }); });
  });
  live.forEach(function (m) { io.observe(m.el); });
}
who.addEventListener("change", start);
start();
</script></html>
